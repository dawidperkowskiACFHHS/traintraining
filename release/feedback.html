<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Last Stop — playtest notes</title><style>body{font:18px/1.5 system-ui,sans-serif;background:#102634;color:#eef5f6;max-width:760px;margin:40px auto;padding:20px}label{display:block;margin:20px 0}input,textarea,button{font:inherit;padding:10px;border:1px solid #8caaba;border-radius:5px;background:#1b3d50;color:white;box-sizing:border-box;width:100%}textarea{height:100px}button{cursor:pointer;background:#315e91}small{color:#bed3df}</style><h1>Your journey, in your words</h1><p>These notes stay on your computer. Download them when finished and share only if you choose. Use Settings → Export playtest / support report in the game to attach the seed and timing information.</p><form id="feedback"><label>Build, seed, input device and approximate session length<input name="session"></label><label>Did you launch and complete practice without help? What got in the way?<textarea name="firstSteps"></textarea></label><label>What did you think your next goal was?<textarea name="goal"></textarea></label><label>Describe one clue and the station it was asked from. What did it rule out?<textarea name="clue"></textarea></label><label>What decision felt clever? What moment would you tell someone about?<textarea name="memorable"></textarea></label><label>Where did you wait, feel confused, or repeat an input?<textarea name="friction"></textarea></label><label>Did the music, sound or motion help or distract?<textarea name="feel"></textarea></label><label>Did you want another round? Why?<textarea name="anotherRound"></textarea></label><label>Hardware, controller, save, performance or other problems<textarea name="technical"></textarea></label><button>Download my notes</button></form><small>No account, upload or analytics.</small><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();const notes=Object.fromEntries(new FormData(e.target));notes.created=new Date().toISOString();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(notes,null,2)],{type:'application/json'}));a.download='last-stop-playtest-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};</script></html>
